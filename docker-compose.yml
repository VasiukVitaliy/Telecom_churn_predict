services:
  api:
    build: .
    env_file: [.env]
    ports: ["8000:8000"]
    volumes:
      - ./data:/app/data
      - ./models:/app/models
  dashboard:
    build: .
    command: streamlit run streamlit_app/app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      API_BASE_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on: [api]
